<!DOCTYPE html>
<html>
<head>
    <title>Textarea and Button Example</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h2>Textarea & Button Example</h2>

<form class="form-box">
    <label for="message">Enter your message:</label><br><br>

    <textarea name="message" id="message" rows="4" cols="30"></textarea>
    <br><br>

    <button type="submit">Send</button>
    <button type="reset">Clear</button>
</form>

</body>
</html>
